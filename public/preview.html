<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LAUNCHPAD ROYALE — Renderer Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05040f;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 10px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(5, 4, 20, 0.6);
        color: #9ff4ff;
        font: 600 12px/1.4 'Space Grotesk', ui-monospace, monospace;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="./dist/preview.js"></script>
  </body>
</html>
